  <rect x="240" y="40" width="240" height="180" rx="3" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(520,0)">
    <text x="0" y="108" class="t title" font-size="62" font-weight="bold">cub<tspan fill="#76EE12">3</tspan>D<tspan class="cursor" fill="#FF4566">_</tspan></text>
