<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0.75"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="view"><rect x="0" y="0" width="800" height="600"/></clipPath>
    <style>
      .t { font-family: 'Courier New', monospace; fill: #e6edf3; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
      .title { animation: glow 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>

  <!-- Minimap, same style as in-game (grey frame, light floor, dark walls, red player) -->
  <g transform="translate(30,40)">
    <rect width="190" height="180" rx="4" fill="#3c3c3c"/>
    <rect x="10" y="10" width="170" height="160" fill="#d3d3d3"/>
    <g fill="#3c3c3c">
      <rect x="45" y="40" width="20" height="50"/>
      <rect x="85" y="75" width="70" height="16"/>
      <rect x="120" y="30" width="22" height="22"/>
      <rect x="35" y="125" width="30" height="20"/>
      <rect x="110" y="120" width="45" height="22"/>
    </g>
    <g transform="translate(28,25)"><g>
      <animateMotion dur="10s" repeatCount="indefinite" rotate="auto"
        path="M0,0 L67,0 Q77,0 77,15 L77,30 Q77,37 67,37 L52,37 Q47,37 47,47 L47,80 Q47,87 57,87 L137,87 L137,125 L52,130 L-6,130 L-6,80 L0,35 Z"/>
      <path d="M0,0 L60,-26 A65,65 0 0 1 60,26 Z" fill="url(#ray)" opacity="0.6"/>
      <g stroke="#ff2b2b" stroke-width="0.8" opacity="0.6">
        <line x1="0" y1="0" x2="60" y2="-26"/><line x1="0" y1="0" x2="65" y2="0"/><line x1="0" y1="0" x2="60" y2="26"/>
      </g>
      <circle r="5" fill="#ff1a1a"/>
    </g></g>
  </g>

